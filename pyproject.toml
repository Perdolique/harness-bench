[project]
name = "agent-stack-benchmark-tooling"
version = "0.0.0"
requires-python = "==3.14.7"
dependencies = ["harbor==0.23.0"]

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.uv]
package = false
required-version = "==0.12.13"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
